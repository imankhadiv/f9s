name: Bug report
description: Report reproducible incorrect behavior in f9s
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove credentials, private hostnames, and sensitive log data. Report security issues through the private security advisory link instead.
  - type: input
    id: f9s-version
    attributes:
      label: f9s version
      description: Run `f9s --version` or provide the commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: flink-version
    attributes:
      label: Flink version and deployment mode
      placeholder: Flink 2.3.0, Kubernetes Application Mode
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant output
      description: Paste sanitized logs, configuration, terminal screenshots, or stack traces.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive production data.
          required: true
