# f9s bundled skin: high-contrast — maximum legibility on both grounds.
colors:
  accent: { light: "#A80030", dark: "#FF7A94" }
  dim: { light: "#4A4454", dark: "#A9A2B4" }
  ok: { light: "#006B2D", dark: "#6FE39B" }
  warn: { light: "#8A5B00", dark: "#FFC24B" }
  error: { light: "#A31515", dark: "#FF6B5E" }
  selectionFg: { light: "#000000", dark: "#FFFFFF" }
  selectionBg: { light: "#F2C7D0", dark: "#6E3245" }
  flow: { light: "#004C99", dark: "#66B3FF" }
  state: { light: "#5C2383", dark: "#D58CFF" }
  backpressure: { light: "#000000", dark: "#FFFFFF" }
