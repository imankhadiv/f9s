version: 2
project_name: f9s

builds:
  - main: ./cmd/f9s
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
      order: 999

# Publish the pre-built binary as a cask. GoReleaser's legacy `brews` publisher
# is deprecated; casks are the supported path for binary distribution.
homebrew_casks:
  - name: f9s
    binaries: [f9s]
    repository:
      owner: imankhadiv
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/imankhadiv/f9s
    description: "A k9s-style terminal UI for Apache Flink"
    # The macOS binary is not notarized; without this, Gatekeeper refuses
    # the quarantined download on first run.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/f9s"]
          end

# Supply-chain trust: SBOMs for every archive, keyless cosign signature on
# the checksums file (verify: cosign verify-blob --certificate checksums.txt.pem
# --signature checksums.txt.sig checksums.txt --certificate-identity-regexp ...).
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
